[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: toutes les routes → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache long pour assets versionnés (Vite ajoute un hash)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
